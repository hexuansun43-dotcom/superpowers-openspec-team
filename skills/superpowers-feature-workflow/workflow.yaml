name: superpowers-feature-workflow
type: workflow
standalone: false
description: Design, plan, implement with TDD, and verify without OpenSpec artifact generation.
model_hint: sonnet
tags:
  - feature
  - tdd
  - workflow
category: engineering
phases:
  - name: clarification
    model_hint: haiku
  - name: brainstorming
  - name: planning
  - name: implementation
  - name: verification
    model_hint: opus
tool_support:
  - codex
  - cursor
  - claude-code
activation:
  mode: explicit-only
  triggers:
    - user-explicit-skill-name
    - user-explicit-workflow-request
    - repo-policy-explicit-requirement
dependencies:
  external_skills:
    - brainstorming
    - writing-plans
    - using-git-worktrees
    - test-driven-development
    - verification-before-completion
optional_features:
  omc_team:
    description: Accelerate with parallel agents when oh-my-claudecode is installed
    roles: [executor, verifier, critic]
    parallel_phases: [implementation, verification]
runtime_requirements: []
outputs:
  - docs/superpowers/specs/
  - docs/superpowers/plans/
  - .superpowers-memory/
  - scripts/run-superpowers-memory-closeout.ps1
  - scripts/validate-superpowers-memory.ps1
  - scripts/search-superpowers-memory.ps1
  - scripts/suggest-superpowers-memory-updates.ps1
